<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイレシピノート</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#ff9800">
</head>
<body>
  <div class="container">
    <header>
      <h1>🍳 マイレシピノート</h1>
    </header>

    <!-- レシピ追加／編集フォーム -->
    <div class="card form-card">
      <h2 id="form-title-text">新規レシピ追加</h2>

      <form id="recipe-form" style="display: none;">
        <input type="hidden" id="recipe-id">

        <!-- 1. レシピ名 -->
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="title" style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 4px;">レシピ名</label>
          <input type="text" id="title" placeholder="例: ハンバーグ" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <!-- 2. 何人前 / 分量 -->
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="yield" style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 4px;">何人前 / 分量 (例: 2人分, 18cm型1個)</label>
          <input type="text" id="yield" placeholder="例: 2人分" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <!-- 3. ジャンル -->
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="category" style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 4px;">ジャンル</label>
          <select id="category" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            <option value="">ジャンルを選択してください</option>
            <option value="和食">和食</option>
            <option value="洋食">洋食</option>
            <option value="中華">中華</option>
            <option value="お菓子">お菓子</option>
            <option value="パン">パン</option>
          </select>
        </div>

        <!-- 4. 材料 -->
        <div class="form-group" style="margin-bottom: 12px;">
          <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 4px;">材料</label>
          <div id="ingredients-list"></div>
          <button type="button" id="add-ingredient-btn" style="margin-top: 6px; padding: 6px 12px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer;">＋ 材料を追加</button>
        </div>

        <!-- 5. 作り方 -->
        <div class="form-group" style="margin-bottom: 12px;">
          <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 4px;">作り方</label>
          <div id="steps-list"></div>
          <button type="button" id="add-step-btn" style="margin-top: 6px; padding: 6px 12px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer;">＋ 手順を追加</button>
        </div>

        <!-- 6. 料理写真 -->
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="image-file" style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 4px;">料理写真</label>
          <input type="file" id="image-file" accept="image/*">
          <div id="image-preview-container" style="display: none; margin-top: 8px; align-items: center; gap: 8px;">
            <img id="image-preview" src="" alt="プレビュー" style="max-width: 120px; max-height: 120px; border-radius: 4px; object-fit: cover;">
            <button type="button" id="remove-image-btn" style="padding: 4px 8px; background: #ff5252; color: #fff; border: none; border-radius: 4px; cursor: pointer;">削除</button>
          </div>
        </div>

        <!-- 7. メモ / 参照URL -->
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="memo" style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 4px;">メモ / 参照URL</label>
          <textarea id="memo" rows="3" placeholder="メモや参照元URLを入力" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"></textarea>
        </div>

        <!-- 8. 保存・キャンセルボタン -->
        <div style="display: flex; gap: 10px; margin-top: 16px;">
          <button type="submit" id="submit-btn" style="flex: 1; padding: 10px; background: #4caf50; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">レシピを保存</button>
          <button type="button" id="cancel-btn" style="display: none; padding: 10px; background: #9e9e9e; color: #fff; border: none; border-radius: 4px; cursor: pointer;">キャンセル</button>
        </div>
      </form>
    </div>

    <!-- 検索・絞り込みエリア -->
    <div class="card search-container">
      <h2>レシピを探す</h2>
      <div class="search-inputs" style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;">
        <input type="text" id="search-keyword" placeholder="料理名で検索..." style="flex: 1; min-width: 180px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        <select id="filter-category" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <option value="all">すべてのジャンル</option>
          <option value="和食">和食</option>
          <option value="洋食">洋食</option>
          <option value="中華">中華</option>
          <option value="お菓子">お菓子</option>
          <option value="パン">パン</option>
        </select>
      </div>

      <div class="ingredient-search-box" style="margin-top: 10px;">
        <label style="font-weight: bold; font-size: 13px; display: block; margin-bottom: 4px;">使う食材で絞り込み (複数入力可)</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" id="ingredient-search-input" placeholder="食材名を入力 (例: 玉ねぎ)" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <button type="button" id="add-ingredient-filter-btn" style="padding: 8px 14px; background: #2196f3; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">追加</button>
        </div>
        <div id="ingredient-tags" style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;"></div>
      </div>
    </div>

    <!-- レシピカード一覧表示領域 -->
    <div id="recipe-list" class="recipe-grid"></div>
  </div>

  <!-- レシピ詳細モーダル -->
  <div id="recipe-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span id="modal-close" class="close">&times;</span>
      <h2 id="modal-title"></h2>
      <span id="modal-category" class="badge"></span>
      <img id="modal-image" src="" alt="料理写真" style="width: 100%; max-height: 250px; object-fit: cover; border-radius: 6px; margin: 12px 0;">

      <h3>材料</h3>
      <ul id="modal-ingredients" class="modal-list"></ul>

      <h3>作り方</h3>
      <ol id="modal-steps" class="modal-list"></ol>

      <div id="modal-memo-container" style="display: none; margin-top: 16px; padding: 10px; background: #f9f9f9; border-radius: 4px;">
        <h3>メモ / 参照リンク</h3>
        <p id="modal-memo" style="word-break: break-all; white-space: pre-wrap;"></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
