<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ レシピノート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🍳 マイ レシピノート</h1>

    <!-- レシピ入力・編集フォーム -->
    <section class="form-section">
      <h2 id="form-title">新規レシピ追加</h2>
      <form id="recipe-form">
        <!-- 編集時にIDを保持する隠しフィールド -->
        <input type="hidden" id="recipe-id">

        <input type="text" id="title" placeholder="料理名 (例: カレーライス)" required>
        
        <select id="category" required>
          <option value="">ジャンルを選択</option>
          <option value="和食">和食</option>
          <option value="洋食">洋食</option>
          <option value="中華">中華</option>
          <option value="その他">その他</option>
        </select>

        <!-- 食材入力枠エリア -->
        <div class="ingredients-container">
          <label><strong>食材リスト</strong></label>
          <div id="ingredients-list">
            <!-- JavaScriptでここに「食材名 / 量」の入力行が追加されます -->
          </div>
          <button type="button" id="add-ingredient-btn" class="btn-secondary">+ 食材を追加</button>
        </div>

        <!-- 画像ファイル入力＆プレビューエリア -->
        <div class="image-input-container">
          <label for="image-file"><strong>レシピ画像</strong></label>
          <input type="file" id="image-file" accept="image/*">
          <div id="image-preview-container" class="image-preview-container" style="display: none;">
            <img id="image-preview" src="" alt="プレビュー">
            <button type="button" id="remove-image-btn" class="btn-danger-sm">画像を削除</button>
          </div>
        </div>

        <textarea id="instructions" placeholder="作り方・メモ" rows="4"></textarea>

        <div class="form-buttons">
          <button type="submit" id="submit-btn">レシピを保存</button>
          <button type="button" id="cancel-btn" style="display: none; background-color: #888;">キャンセル</button>
        </div>
      </form>
    </section>

    <!-- 検索・絞り込みエリア -->
    <section class="search-section">
      <h2>レシピを探す</h2>
      <div class="search-controls">
        <input type="text" id="search-keyword" placeholder="料理名や食材で検索...">
        <select id="filter-category">
          <option value="all">すべてのジャンル</option>
          <option value="和食">和食</option>
          <option value="洋食">洋食</option>
          <option value="中華">中華</option>
          <option value="その他">その他</option>
        </select>
      </div>
    </section>

    <!-- レシピ一覧表示 -->
    <section class="list-section">
      <div id="recipe-list" class="recipe-grid"></div>
    </section>
  </div>

  <!-- レシピ拡大表示用モーダル（画面全体表示） -->
  <div id="recipe-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="modal-close">&times;</span>
      <img id="modal-image" src="" alt="">
      <div class="modal-body">
        <span id="modal-category" class="badge"></span>
        <h2 id="modal-title"></h2>
        
        <h3>材料</h3>
        <ul id="modal-ingredients" class="modal-ingredients-list"></ul>

        <h3>作り方・メモ</h3>
        <p id="modal-instructions" class="modal-instructions-text"></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
